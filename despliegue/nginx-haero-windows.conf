# nginx para HAERO en el servidor Windows del hospital (E:\SICOMED\nginx\conf\nginx.conf).
# El puerto 80/443 lo usa http.sys (otros sistemas), por eso HAERO sigue en 8090, ahora con https
# (necesario para que los celulares usen la cámara como lector de códigos).

worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 8090 ssl;
        server_name 172.16.5.190 haero.hospital.local;

        # Quien escriba http://…:8090 se manda a https://…:8090 (nginx responde 497 a http en un puerto https).
        error_page 497 =301 https://$host:8090$request_uri;

        # Creados con despliegue/crear-certificado.sh
        ssl_certificate     ssl/haero.crt;
        ssl_certificate_key ssl/haero.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        root E:/SICOMED/frontend;
        index index.html;
        client_max_body_size 12m;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self)" always;
    }
}
