# nginx para HAERO: sirve el frontend compilado y reenvía /api al backend.
# Copiar a /etc/nginx/conf.d/haero.conf (o sites-available) y ajustar server_name y rutas.
server {
    listen 80;
    server_name haero.hospital.local;

    # Salida de `npm run build` (carpeta browser dentro de dist).
    root /opt/haero/frontend;
    index index.html;

    # Escaneos PDF de préstamos y transferencias (el backend acepta hasta 10 MB).
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Angular maneja sus rutas (/almacen, /farmacia, ...): todo lo demás va a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
