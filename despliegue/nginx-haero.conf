# nginx para HAERO: sirve el frontend compilado y reenvía /api al backend.
# Copiar a /etc/nginx/conf.d/haero.conf (o sites-available) y ajustar server_name, rutas y certificados.
#
# HTTPS es necesario para usar la cámara del celular o la tableta como lector de códigos: el
# navegador solo la permite en páginas seguras. Computadoras y celulares abren la MISMA dirección
# (https://haero.hospital.local). Ver DESPLIEGUE.md, sección "HTTPS".

# Quien entre por http:// se manda a https://.
server {
    listen 80;
    server_name haero.hospital.local 172.16.0.0;   # nombre y la IP fija del servidor
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name haero.hospital.local 172.16.0.0;   # el mismo nombre y la misma IP que trae el certificado

    # Certificado y su llave (la llave solo la puede leer root/nginx).
    ssl_certificate     /etc/nginx/ssl/haero.pem;
    ssl_certificate_key /etc/nginx/ssl/haero-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Salida de `npm run build` (carpeta browser dentro de dist).
    root /opt/haero/frontend;
    index index.html;

    # Escaneos PDF de préstamos y transferencias (el backend acepta hasta 10 MB).
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Angular maneja sus rutas (/almacen, /farmacia, ...): todo lo demás va a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # La cámara solo para HAERO mismo (lector de códigos).
    add_header Permissions-Policy "camera=(self)" always;
}
