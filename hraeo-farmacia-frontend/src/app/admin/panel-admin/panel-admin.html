<div class="panel">
  <app-topbar
    [nombreCompleto]="session.usuarioActual()?.nombreCompleto ?? ''"
    [rol]="rolEtiqueta[session.usuarioActual()!.rol]"
  />
  <div class="shell">
    <app-sidebar [items]="items" />
    <div class="main">
      <div class="card">
        <h1>Bienvenido/a, {{ session.usuarioActual()?.nombreCompleto }}</h1>
        <p>Administración de usuarios y roles.</p>
      </div>
      <div class="empty-area">Área de trabajo del módulo (se habilita en la iteración correspondiente)</div>
    </div>
  </div>
</div>
