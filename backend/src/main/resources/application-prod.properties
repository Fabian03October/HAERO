# Perfil del servidor del hospital: se activa con SPRING_PROFILES_ACTIVE=prod.
# Las tablas solo las crea y cambia Flyway; Hibernate solo revisa que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Sin trazas internas en las respuestas de error.
server.error.include-stacktrace=never
server.error.include-message=never
