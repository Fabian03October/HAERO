spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=farmacia;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:farmacia_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=com.example.backend.config.SqlServer2012Dialect

spring.flyway.locations=classpath:db/migration

# Versión vigente de las políticas de uso y privacidad; debe coincidir con
# VERSION_POLITICAS del frontend (auth/politicas.ts).
politicas.version=1.0
